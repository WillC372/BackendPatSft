spring:
  datasource:
    url: jdbc:h2:mem:aquasense;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  mail:
    host:

aquasense:
  reference:
    # Tests never call the real USGS API; ReferenceDataImportTest uses a local server with recorded responses.
    enabled: false
    initial-delay-ms: 3600000
    retry-wait-ms: 50
  security:
    jwt-secret: test-secret-key-that-is-long-enough-for-hs256-signing-0123456789
    access-token-hours: 8
    remember-me-days: 30
    admin-email: admin@aquasense.test
    rate-limit-per-minute: 1000
  cors:
    allowed-origins: http://localhost:5500
  mail:
    from: test@aquasense.local
    frontend-reset-url: http://localhost:5500/#/reset-password
  ai:
    api-key:
    model: claude-opus-5-5
    effort: low
    max-tokens: 16000
    daily-quota-free: 2
    daily-quota-premium: 100
    cache-minutes: 10
  device:
    sample-interval-ms: 50
    measure-samples: 3
    simulator-enabled: true

management:
  health:
    mail:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
