server:
  port: ${PORT:8080}
  # Behind a hosting proxy (Render) set FORWARD_HEADERS_STRATEGY=native so the client IP and HTTPS are detected.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-stacktrace: never

spring:
  application:
    name: aquasense-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aquasense}
    username: ${DB_USER:aquasense}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      # /actuator/health/liveness only says the process is up (it does not query the database): it is the address for
      # keep-alive pings, so they keep Render awake without keeping the Neon database awake. /health checks everything.
      probes:
        enabled: true

# Interactive API documentation. In production it is better to disable it: API_DOCS_ENABLED=false.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Off unless API_DOCS_ENABLED=true (development): the public map of the API helps an attacker.
    enabled: ${API_DOCS_ENABLED:false}
  api-docs:
    path: /v3/api-docs
    enabled: ${API_DOCS_ENABLED:false}

aquasense:
  reference:
    enabled: ${REFERENCE_DATA_ENABLED:true}
    base-url: https://api.waterdata.usgs.gov/ogcapi/v0
    # Optional api.data.gov key: raises the USGS request limit (the data is public without it).
    api-key: ${USGS_API_KEY:}
    # Featured USGS stations that report pH continuously (rivers in different states).
    featured: ${REFERENCE_STATIONS:USGS-01467200,USGS-01463500,USGS-04231600,USGS-03374100,USGS-08062500,USGS-09070500,USGS-11467000,USGS-14211010}
  demo:
    enabled: ${DEMO_ACCOUNTS_ENABLED:true}
    password: ${DEMO_ACCOUNTS_PASSWORD:AquaSense-Demo-2026}
  security:
    jwt-secret: ${JWT_SECRET:}
    access-token-hours: 8
    remember-me-days: 30
    admin-email: ${ADMIN_EMAIL:}
    rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:10}
    # Header with the real client address set by the proxy in front (Cloudflare on Render). Empty: the connection address.
    client-ip-header: ${CLIENT_IP_HEADER:CF-Connecting-IP}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
  mail:
    from: ${MAIL_FROM:no-reply@aquasense.local}
    frontend-reset-url: ${FRONTEND_RESET_URL:http://localhost:5500/#/reset-password}
    frontend-admin-verify-url: ${FRONTEND_ADMIN_VERIFY_URL:http://localhost:5500/#/verify-admin}
    # DEVELOPMENT ONLY: without an email channel, writes the recovery link to the log. Never enable it in production.
    log-reset-links: ${MAIL_LOG_RESET_LINKS:false}
  ai:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${AI_MODEL:claude-opus-5-5}
    effort: ${AI_EFFORT:low}
    max-tokens: 16000
    daily-quota-free: ${AI_DAILY_QUOTA_FREE:20}
    daily-quota-premium: ${AI_DAILY_QUOTA_PREMIUM:200}
    cache-minutes: 10
    # Fallback chain: every provider is tried in order; if all fail, the built-in rules are used.
    providers:
      - id: gemini
        label: Google Gemini
        base-url: https://generativelanguage.googleapis.com/v1beta/openai
        api-key: ${GEMINI_API_KEY:}
        model: ${GEMINI_MODEL:gemini-3.5-flash}
        timeout-seconds: 45
        vision: true
        tools: true
      - id: gemini-lite
        label: Google Gemini
        base-url: https://generativelanguage.googleapis.com/v1beta/openai
        api-key: ${GEMINI_API_KEY:}
        model: ${GEMINI_FALLBACK_MODEL:gemini-3.5-flash-lite}
        timeout-seconds: 30
        vision: true
        tools: true
        fast: true
      - id: groq
        label: Groq
        base-url: https://api.groq.com/openai/v1
        api-key: ${GROQ_API_KEY:}
        model: ${GROQ_MODEL:openai/gpt-oss-120b}
        timeout-seconds: 45
        vision: false
        tools: true
        fast: true
        reasoning-effort: low
      - id: groq-vision
        label: Groq
        base-url: https://api.groq.com/openai/v1
        api-key: ${GROQ_API_KEY:}
        model: ${GROQ_VISION_MODEL:qwen/qwen3.8-27b}
        timeout-seconds: 45
        vision: true
        tools: false
  # Prices per million tokens (USD) to estimate costs. With billing FREE the real charge is 0 (free plan).
  # Reference values published by third-party aggregators (anotherwrapper.com, pricepertoken.com, morphllm.com),
  # checked on Nov 7, 2026. They were NOT verified on the official pages: ai.google.dev/gemini-api/docs/pricing and groq.com/pricing.
  # Premium payments with PayU. By default, the sandbox with the public PayU test credentials
  # (merchant 508029, account 512321 Colombia): it moves no real money. Production: PAYU_TEST=false and your own credentials.
  payments:
    enabled: ${PAYMENTS_ENABLED:true}
    price: ${PREMIUM_PRICE:49900}
    currency: COP
    period-days: ${PREMIUM_PERIOD_DAYS:30}
    reminder-days: 3
    response-url: ${PAYMENTS_RESPONSE_URL:http://localhost:5500/#/billing}
    confirmation-url: ${PAYMENTS_CONFIRMATION_URL:}
    payu:
      merchant-id: ${PAYU_MERCHANT_ID:}
      account-id: ${PAYU_ACCOUNT_ID:}
      api-key: ${PAYU_API_KEY:}
      api-login: ${PAYU_API_LOGIN:}
      checkout-url: ${PAYU_CHECKOUT_URL:}
      api-url: ${PAYU_API_URL:}
      test: ${PAYU_TEST:true}
  # Email delivery. provider: auto (Mailjet, Brevo or SMTP, the first one configured), mailjet, brevo, smtp or none.
  mail-delivery:
    provider: ${MAIL_PROVIDER:auto}
    sender-name: ${MAIL_SENDER_NAME:AquaSense AI}
    brevo:
      api-key: ${BREVO_API_KEY:}
      base-url: ${BREVO_BASE_URL:https://api.brevo.com/v3}
      timeout-seconds: 15
    mailjet:
      api-key: ${MAILJET_API_KEY:}
      secret-key: ${MAILJET_SECRET_KEY:}
      base-url: ${MAILJET_BASE_URL:https://api.mailjet.com}
      timeout-seconds: 15
  ai-pricing:
    billing: ${AI_BILLING:FREE}
    note: Precios de referencia de terceros, no verificados en la página oficial del proveedor. Revisa y ajusta antes de usarlos para facturar.
    models:
      - model: gemini-3.5-flash
        input-per-million: ${PRICE_GEMINI_FLASH_IN:1.50}
        output-per-million: ${PRICE_GEMINI_FLASH_OUT:9.00}
        source: Agregadores de terceros (anotherwrapper.com, pricepertoken.com)
        checked-on: "2026-11-07"
        verified: false
      - model: gemini-3.5-flash-lite
        input-per-million: ${PRICE_GEMINI_LITE_IN:0.30}
        output-per-million: ${PRICE_GEMINI_LITE_OUT:2.50}
        source: Agregadores de terceros (anotherwrapper.com, pricepertoken.com)
        checked-on: "2026-11-07"
        verified: false
      - model: openai/gpt-oss-120b
        input-per-million: ${PRICE_GROQ_OSS_IN:0.15}
        output-per-million: ${PRICE_GROQ_OSS_OUT:0.60}
        source: Agregadores de terceros (morphllm.com, flexprice.io)
        checked-on: "2026-11-07"
        verified: false
      - model: qwen/qwen3.8-27b
        input-per-million: ${PRICE_GROQ_QWEN_IN:0.80}
        output-per-million: ${PRICE_GROQ_QWEN_OUT:4.00}
        source: Agregador de terceros (morphllm.com); modelo en vista previa
        checked-on: "2026-11-07"
        verified: false
  device:
    sample-interval-ms: 1000
    measure-samples: 5
    # The simulated meter is only for automated tests: a deployed app shows real meters only.
    simulator-enabled: ${SIMULATOR_ENABLED:false}
