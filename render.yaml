# Render Blueprint for the AquaSense AI backend (Docker, free plan).
# Render -> New -> Blueprint -> select this repository. Values marked "sync: false" are typed in the Render
# dashboard when the Blueprint is created; they are never stored in the repository.
services:
  - type: web
    name: aquasense-backend-willc372
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      # Neon connection string: postgresql://user:password@host/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FORWARD_HEADERS_STRATEGY
        value: native
      - key: DB_POOL_SIZE
        value: "5"
      - key: CORS_ORIGINS
        value: https://frontendpatsft.vercel.app
      - key: FRONTEND_RESET_URL
        value: https://frontendpatsft.vercel.app/#/reset-password
      - key: FRONTEND_ADMIN_VERIFY_URL
        value: https://frontendpatsft.vercel.app/#/verify-admin
      - key: PAYMENTS_RESPONSE_URL
        value: https://frontendpatsft.vercel.app/#/billing
      - key: PAYMENTS_CONFIRMATION_URL
        value: https://aquasense-backend-willc372.onrender.com/api/v1/payments/payu/confirmation
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_SECRET_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
